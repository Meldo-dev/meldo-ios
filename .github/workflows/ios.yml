name: iOS

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**"
  workflow_dispatch:
  # Also run by release.yml, which publishes the build as a GitHub Release.
  workflow_call:
    # Named instead of `secrets: inherit`, so a caller hands over only these.
    secrets:
      MELDO_GOOGLE_CLIENT_ID_IOS: { required: false }
      MELDO_TEAMS_CLIENT_ID: { required: false }

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  build-and-test:
    name: Build and test (simulator)
    runs-on: macos-26
    # An explicit bash shell runs with pipefail, so a failing xcodebuild fails its step even when
    # piped into xcbeautify (the default shell has no pipefail and let failing tests through).
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - name: Build Rust core XCFramework and Swift bindings
        # Release Rust in everything that can become a published IPA; debug only for pull requests.
        run: PROFILE=${{ github.event_name == 'pull_request' && 'debug' || 'release' }} bash scripts/build-rust-ios.sh

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      # OAuth client IDs are not in the repo; empty secrets build an app without Drive/Teams.
      - name: OAuth client IDs
        env:
          GOOGLE_ID: ${{ secrets.MELDO_GOOGLE_CLIENT_ID_IOS }}
          TEAMS_ID: ${{ secrets.MELDO_TEAMS_CLIENT_ID }}
        run: printf 'MELDO_GOOGLE_CLIENT_ID = %s\nMELDO_TEAMS_CLIENT_ID = %s\n' "$GOOGLE_ID" "$TEAMS_ID" > Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), reverse=True)
          for r in runtimes:
              for d in data[r]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")')
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"

      - name: Test MeldeCore package (Rust through UniFFI)
        working-directory: MeldeCore
        run: |
          xcodebuild test -scheme MeldeCore \
            -destination "${{ steps.sim.outputs.destination }}" \
            -resultBundlePath "$RUNNER_TEMP/MeldeCore.xcresult" | xcbeautify

      - name: Build and test app
        run: |
          xcodebuild test -project MeldePlanner.xcodeproj -scheme MeldePlanner \
            -destination "${{ steps.sim.outputs.destination }}" \
            -resultBundlePath "$RUNNER_TEMP/MeldePlanner.xcresult" \
            -skip-testing:MeldePlannerUITests \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      # Unsigned device build for sideloading with a free Apple ID (AltStore / Sideloadly
      # re-sign it on the user's PC). Not for distribution.
      - name: Build unsigned device IPA
        run: |
          xcodebuild build -project MeldePlanner.xcodeproj -scheme MeldePlanner \
            -configuration Release -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify
          app="$RUNNER_TEMP/device/Build/Products/Release-iphoneos/MeldePlanner.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          # Ad-hoc sign so the App Group entitlement travels with the IPA; sideloading
          # tools re-sign it with the user's Apple ID and keep the entitlements.
          codesign --force --sign - --entitlements MeldeWidgets/MeldeWidgets.entitlements "$app/PlugIns/MeldeWidgets.appex"
          codesign --force --sign - --entitlements MeldePlanner/MeldePlanner.entitlements "$app"
          codesign -d --entitlements - "$app" | grep -q "group.app.meldeplanner.ios" || { echo "::error::App Group entitlement missing"; exit 1; }
          test -d "$app/PlugIns/MeldeWidgets.appex" || { echo "::error::widget extension missing"; exit 1; }
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          # Every supported language must ship, German included (it is the source language).
          for lang in de en; do
            test -f "$app/$lang.lproj/Localizable.strings" || { echo "::error::missing $lang.lproj in app bundle"; exit 1; }
          done
          (cd "$RUNNER_TEMP/ipa" && zip -qry "MeldePlanner-unsigned-${GITHUB_SHA::7}.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MeldePlanner-unsigned-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcresults
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7
